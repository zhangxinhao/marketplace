resolver = 1
name = "ora-space.skillhub"
namespace = "official"
kind = "webview"
version = "0.1.0"
description = "Ora Space SkillHub surface"
homepage = "https://github.com/ora-space/ui-plugins"
license = "Apache-2.0"
url = "https://github.com/zhangxinhao/ui-plugins/releases/download/skillhub/v0.1.0/ora-space.skillhub-v0.1.0.orax"
sha256 = "562519418cfde4761eef28aac4aae3cb1bba6c1beba12ed77aac3472736b6e39"

[webview]
start_url = "https://www.skillhub.cn"
allowed_origins = ["https://www.skillhub.cn","https://skillhub.cn"]

[webview.downloads.fallback]
reject = true

[[webview.downloads.rules]]

[webview.downloads.rules.page]
origin = "https://www.skillhub.cn"
path_prefix = "/"

[webview.downloads.rules.action]
prompt = ["import_skill","save_as"]

[[webview.downloads.rules]]

[webview.downloads.rules.page]
origin = "https://skillhub.cn"
path_prefix = "/"

[webview.downloads.rules.action]
prompt = ["import_skill","save_as"]
